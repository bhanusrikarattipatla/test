apiVersion: apps/v1
kind: Deployment
metadata:
  name: stu-dep
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stu-api
  template:
    metadata:
      labels:
        app: stu-api
    spec:
      containers:
        - name: stu-cont
          image: stu-api:latest
          imagePullPolicy: IfNotPresent
          ports:
           - containerPort: 8000
